name: RAG Security Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Offline security regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/ingestion/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/ingestion/requirements-ci.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app/ingestion/src

      - name: Run ACL security tests
        working-directory: app/ingestion/src
        env:
          AZURE_SEARCH_ENDPOINT: https://example.search.windows.net
          AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com/
          ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_FINANCE_GROUP_ID: 00000000-0000-0000-0000-000000000001
          ENTRA_EMPLOYEES_GROUP_ID: 00000000-0000-0000-0000-000000000002
          RAG_AUDIT_HMAC_KEY: ci-only-audit-hmac-key-not-for-production-123456
        run: python test_acl_defense.py

      - name: Run audit logger security tests
        working-directory: app/ingestion/src
        run: python test_audit_logger.py

      - name: Run audit-event security tests
        working-directory: app/ingestion/src
        env:
          AZURE_SEARCH_ENDPOINT: https://example.search.windows.net
          AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com/
          ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_FINANCE_GROUP_ID: 00000000-0000-0000-0000-000000000001
          ENTRA_EMPLOYEES_GROUP_ID: 00000000-0000-0000-0000-000000000002
          RAG_AUDIT_HMAC_KEY: ci-only-audit-hmac-key-not-for-production-123456
        run: python test_audit_events.py

      - name: Run correlation ID security tests
        working-directory: app/ingestion/src
        env:
          AZURE_SEARCH_ENDPOINT: https://example.search.windows.net
          AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com/
          ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_FINANCE_GROUP_ID: 00000000-0000-0000-0000-000000000001
          ENTRA_EMPLOYEES_GROUP_ID: 00000000-0000-0000-0000-000000000002
          RAG_AUDIT_HMAC_KEY: ci-only-audit-hmac-key-not-for-production-123456
        run: python test_correlation_ids.py

      - name: Run API error-handling tests
        working-directory: app/ingestion/src
        env:
          AZURE_SEARCH_ENDPOINT: https://example.search.windows.net
          AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com/
          ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_FINANCE_GROUP_ID: 00000000-0000-0000-0000-000000000001
          ENTRA_EMPLOYEES_GROUP_ID: 00000000-0000-0000-0000-000000000002
          RAG_AUDIT_HMAC_KEY: ci-only-audit-hmac-key-not-for-production-123456
        run: python test_api_errors.py
